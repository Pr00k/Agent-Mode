[package]
name = "arena-agent"
version = "1.1.0"
description = "Arena Agent native shell"
authors = ["Arena Agent"]
edition = "2021"
license = "MIT"

[lib]
name = "arena_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-notification = "2.3"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-os = "2.3"
tauri-plugin-process = "2.3"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2.4"
tauri-plugin-log = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2.4"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
